{% extends 'attendance/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="mb-4">Welcome to Attendance System</h1>
        <p class="lead">A simple and reliable attendance management system for teachers and students</p>
        
        {% if not user.is_authenticated %}
        <div class="mt-5">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg me-3">Login</a>
            <a href="{% url 'register' %}" class="btn btn-outline-primary btn-lg">Register</a>
        </div>
        {% else %}
        <div class="mt-5">
            <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg">Go to Dashboard</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
